[package]
name = "post-quantum-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.12"
post-quantum-core = { path = "../crates/core" }
post-quantum-platform = { path = "../crates/platform" }

[workspace]
members = ["."]

[[bin]]
name = "byte_inputs"
path = "fuzz_targets/byte_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "operations"
path = "fuzz_targets/operations.rs"
test = false
doc = false
bench = false

[[bin]]
name = "primitives"
path = "fuzz_targets/primitives.rs"
test = false
doc = false
bench = false
