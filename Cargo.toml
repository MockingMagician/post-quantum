[workspace]
members = ["crates/core", "crates/node", "crates/platform"]
exclude = ["fuzz", "validation/rust", "validation/timing"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.test]
opt-level = 2
